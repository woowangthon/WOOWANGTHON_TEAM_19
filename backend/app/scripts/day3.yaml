# scripted 모드 대본 (명세 부록 C, 점검 문서 7-1 B2). 키 = (scenario, phase, hint_level, judge, step).
# scenario = day3-{스타일 코드}. EBSP 같이 풀어주는(장난·크게 칭찬·짧게) / EQLC 들어주는(존댓말·차분·자세히)
# / DQSC 짚어주는(볼 곳 하나·조용히·짧게).
# judge = 서버 판정(correct / wrong). 열이 없으면 「판정 없음」 줄(숫자·분수 답이 아닌 말).
# study는 hint_level 0~3 × 판정 3종을 모두 둔다. wrong은 step 1·2를 달리 써서 반복되지 않게 한다
# (step = 이 단계에서 아이가 말한 순번, 없으면 그 키의 가장 큰 step).
# 정답 줄은 되묻지 않는다(화면의 다음 행동이 「계속」 버튼). 답 문장에는 숫자를 쓰지 않는다
# (문제마다 다르고, 한 글자 정답도 있어 누출 검사에 걸린다 — tests/test_script_day3.py).
# 🔴 응답은 여기에 넣지 않는다(서버 고정 문장). 다리 놓기 요약(phase summary)은 템플릿으로 간다.

