[project]
name = "chingu1-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "anthropic>=2.8.0",
    "fastapi>=0.162.2",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.1.8",
    "tzdata>=2026.6",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
    "types-pyyaml>=6.0.12.20261103",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F 기본 + import 정렬 + 버그 패턴. 해커톤이라 규칙은 적게, 자동 고침 위주.
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["app", "tests"]
venvPath = "."
venv = ".venv"
