<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget: 안드로이드 크롬에서 키보드가 올라오면 화면 틀을 줄여 수다 입력창이 가려지지 않게 -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- 밝은 화면만 쓴다: 폰이 다크 모드여도 브라우저가 색을 뒤집지 않게(기존 디자인 유지) -->
    <meta name="color-scheme" content="light" />
    <!-- tokens.css의 --color-bg와 같은 값 -->
    <meta name="theme-color" content="#FFF9EF" />
    <title>AI 멘토</title>
    <!-- 홈 화면에 추가(설치) 정보와 아이콘: 기존 캐릭터 그림(public/mascot)을 그대로 쓴다 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- GPT-005: 크림 배경 말 얼굴 앱 아이콘(public/icons) -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
